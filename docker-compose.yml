services:

  research-nexus-1:
    image: research-nexus:latest
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/research_nexus
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1906
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  research-nexus-2:
    image: research-nexus:latest
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/research_nexus
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1906
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: research-nexus-redis
    ports:
      - "6379:6379"
  nginx:
    image: nginx:latest
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - research-nexus-1
      - research-nexus-2