name: Research Nexus CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: chmod +x mvnw && ./mvnw clean package

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test EC2 SSH port
        run: |
          timeout 10 bash -c '</dev/tcp/${{ secrets.EC2_HOST }}/22' \
            && echo "EC2 port 22 is reachable" \
            || (echo "EC2 port 22 is NOT reachable" && exit 1)

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/research-nexus
            git pull origin main
            docker compose build research-nexus-1 research-nexus-2
            docker compose up -d --no-deps research-nexus-1 research-nexus-2
            docker image prune -f